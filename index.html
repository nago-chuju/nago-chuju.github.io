<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<title>桜中対策プリント</title>
<style>
  :root { --ink:#1f2937; --sub:#6b7280; --line:#d1d5db; --bg:#f6f7fb; --accent:#2f6fdf; --soft:#eef4ff; --ok:#047857; --okbg:#ecfdf5; --ng:#dc2626; --ngbg:#fef2f2; --warn:#b45309; --warnbg:#fff7ed; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif; font-size: 15px; line-height: 1.7; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 14px; }
  button.pri { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: bold; }
  button:disabled { opacity: .5; cursor: default; }
  input, select { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 12px 16px 60px; }
  .top { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .top .wrap { padding: 8px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand { font-weight: bold; font-size: 17px; margin-right: auto; }
  .tabs button { border: none; background: none; border-bottom: 3px solid transparent; border-radius: 0; padding: 6px 10px; }
  .tabs button.on { border-bottom-color: var(--accent); color: var(--accent); font-weight: bold; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 10px 0; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .chips button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .month { margin: 14px 0 4px; font-weight: bold; color: var(--sub); }
  .month.now { color: var(--accent); }
  .mgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 8px 0 4px; }
  .mgrid button { padding: 10px 0; font-size: 16px; font-weight: bold; }
  .mgrid button.now { border-color: var(--accent); color: var(--accent); }
  .mgrid button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .mhead { margin: 12px 0 2px; font-size: 20px; font-weight: bold; }
  .mhead .small { font-weight: normal; margin-left: 6px; }
  @media (max-width: 480px) { .mgrid { grid-template-columns: repeat(4, 1fr); } }
  .unit { display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin: 6px 0; cursor: pointer; }
  .unit:hover { border-color: var(--accent); }
  .unit .nm { font-weight: bold; }
  .unit .pt { font-size: 12.5px; color: var(--sub); }
  .unit .cnt { margin-left: auto; font-size: 12px; white-space: nowrap; color: var(--sub); }
  .unit.empty { opacity: .6; cursor: default; }
  .unit.test { border-style: dashed; background: #fbfcff; }
  .wk { font-size: 12.5px; font-weight: bold; color: var(--sub); margin: 8px 0 0 4px; }
  .wk.now { color: #fff; background: var(--accent); display: inline-block; padding: 0 8px; border-radius: 10px; }
  .lv { display: inline-block; font-size: 11px; border: 1px solid var(--accent); color: var(--accent); border-radius: 10px; padding: 0 7px; margin-right: 4px; white-space: nowrap; }
  .lv.標準 { border-color: #7c3aed; color: #7c3aed; } .lv.挑戦 { border-color: var(--ng); color: var(--ng); }
  .tp { display: inline-block; font-size: 11px; background: #f3f4f6; border-radius: 4px; padding: 0 6px; margin-right: 4px; }
  .qpick { display: flex; gap: 10px; align-items: flex-start; border-top: 1px solid #f0f0f0; padding: 8px 0; }
  .qpick input { margin-top: 6px; width: 18px; height: 18px; }
  .qpick .t { font-size: 14px; }
  .small { font-size: 12.5px; color: var(--sub); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .err { background: var(--ngbg); color: var(--ng); border-radius: 8px; padding: 8px 12px; margin: 8px 0; }
  .msg { background: var(--okbg); color: var(--ok); border-radius: 8px; padding: 8px 12px; margin: 8px 0; }
  .loading { color: var(--sub); padding: 20px 0; text-align: center; }
  table.grid { border-collapse: collapse; width: 100%; background: #fff; font-size: 13.5px; }
  table.grid th, table.grid td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
  table.grid th { background: #f3f4f6; font-weight: normal; font-size: 12px; }

  .scroll { overflow-x: auto; }
  .sc { width: 52px; text-align: center; padding: 4px; }

  .r0 { background: #fde2e2; } .r1 { background: #fff1d6; } .r2 { background: #eef7e8; } .r3 { background: #d7f0dc; }
  .bar { height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; min-width: 80px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .login { max-width: 360px; margin: 80px auto; text-align: center; }
  /* 分数：分子・線・分母の3段。線の上下のすき間を同じにし、線がまわりの文字のまん中の高さにくるようにする */
  .frac { display: inline-flex; flex-direction: column; align-items: stretch; vertical-align: middle; text-align: center; line-height: 1; margin: 0 2px; font-size: .92em; }
  .frac .fn, .frac .fd { display: block; padding: 0 2px; }
  .frac .fl { display: block; height: 0; border-top: 1.5px solid currentColor; margin: 2px 0; }
  .mixed { display: inline-flex; align-items: center; vertical-align: middle; margin: 0 2px; }
  .mixed .whole { font-size: 1.05em; margin-right: 1px; }
  .mixed .frac { margin-left: 0; font-size: .9em; }
  /* 分数で答える問題の解答らん：分子と分母を書くわく */
  .fbox { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 6px; }
  .fbox .n, .fbox .d { display: block; width: 42px; height: 26px; border: 1.5px solid var(--ink); }
  .fbox .fbar { display: block; width: 56px; border-top: 2px solid var(--ink); margin: 3px 0; }
  .wbox1 { display: inline-block; width: 36px; height: 36px; border: 1.5px solid var(--ink); vertical-align: middle; }
  .fig svg { display: block; width: 220px; max-width: 100%; height: auto; }

  /* ===== 印刷するプリント ===== */

  .ph { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2.5px solid var(--ink); padding-bottom: 6px; margin-bottom: 12px; gap: 12px; flex-wrap: wrap; }
  .ph h1 { font-size: 20px; margin: 0; }
  .ph .meta { font-size: 12px; color: var(--sub); }
  .ph .fields { font-size: 13px; display: flex; gap: 14px; flex-wrap: wrap; }
  .ph .fields span { display: inline-block; min-width: 110px; border-bottom: 1px solid var(--ink); }
  .ph .tag { font-size: 11px; background: var(--ink); color: #fff; padding: 1px 8px; border-radius: 4px; }
  .pq { padding: 10px 0 12px; border-bottom: 1px dashed var(--line); break-inside: avoid; }
  .pq .no { font-weight: bold; font-size: 16px; margin-right: 4px; }
  .pq .pts { font-size: 12px; color: var(--sub); }
  .pq .body { display: flex; gap: 14px; align-items: flex-start; }
  .pq .body .tx { flex: 1; }
  .pq .fig { flex: 0 0 180px; }
  .pq .fig svg { width: 180px; }
  .pq .body { flex-wrap: wrap; }
  .pq .fig.wide { flex: 0 0 100%; }
  .pq .fig.wide svg { width: 400px; margin: 4px auto 0; }
  .chs { margin: 6px 0 0 6px; }
  .chs > div { margin: 2px 0; }

  .ansline { margin-top: 8px; text-align: right; font-size: 14px; }
  .ansline .box { display: inline-block; min-width: 130px; border-bottom: 1.5px solid var(--ink); margin: 0 6px; }
  .wbox { margin-top: 8px; border: 1.5px solid var(--ink); border-radius: 4px; }
  .wbox div { height: 30px; border-bottom: 1px dotted #9ca3af; }

  .exp { background: var(--soft); border-radius: 6px; padding: 6px 10px; margin-top: 6px; font-size: 13.5px; }
  .why { font-size: 12.5px; margin-top: 4px; }
  .rub { background: var(--warnbg); border: 1px solid #fed7aa; border-radius: 6px; padding: 6px 10px; margin-top: 6px; font-size: 13px; }
  .tt { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tt th, .tt td { border: 1px solid var(--line); padding: 5px 7px; text-align: left; vertical-align: top; }
  .tt th { background: #f3f4f6; white-space: nowrap; }
  .plan h3 { font-size: 15px; margin: 14px 0 4px; border-left: 4px solid var(--accent); padding-left: 8px; }
  .plan .pp { font-size: 15.5px; font-weight: bold; border: 2px solid var(--accent); border-radius: 8px; padding: 8px 12px; margin-top: 10px; }
  .plan .pl { display: inline-block; font-size: 11px; background: var(--accent); color: #fff; border-radius: 4px; padding: 0 6px; margin-right: 8px; vertical-align: 2px; }
  .plan .flow { margin: 4px 0; padding-left: 22px; font-size: 13.5px; }
  .plan .board { border: 2px solid #374151; background: #f8faf8; border-radius: 4px; padding: 8px 12px; font-size: 13.5px; line-height: 1.9; }
  .plan .talk { font-size: 13.5px; }
  .plan .tk { display: flex; gap: 8px; padding: 2px 0; border-bottom: 1px dotted #e5e7eb; }
  .plan .tk .who { flex: 0 0 32px; font-size: 11px; font-weight: bold; color: #fff; background: var(--accent); border-radius: 4px; text-align: center; height: 18px; line-height: 18px; margin-top: 3px; }
  .plan .tk.S .who { background: #059669; }
  .plan .prep { font-size: 13.5px; margin-top: 8px; }
  .plan .trip { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 13.5px; padding: 3px 0; border-bottom: 1px dotted #e5e7eb; }
  .plan .trip .ng { color: var(--ng); }
  .plan .trip .arrow { color: var(--sub); }
  .plan .trip .say { font-weight: bold; }
  .plan .ans { font-size: 13.5px; border: 1px solid #fcd9b6; background: var(--warnbg); border-radius: 6px; padding: 6px 10px; }
  .plan details.more { margin-top: 14px; }
  .plan details.more > summary { cursor: pointer; font-weight: bold; color: var(--accent); padding: 8px 10px; border: 1px dashed var(--accent); border-radius: 8px; }
  @media print { .plan details.more > summary { display: none; } }
  /* ===== 問題ごとの台本（一覧 → 1問の画面） ===== */
  .qp-meta div { font-size: 14.5px; }
  .qp-meta b { display: inline-block; min-width: 4.5em; color: var(--sub); font-weight: normal; }
  .qp-sec { font-weight: bold; margin: 14px 0 6px; }
  .qp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; }
  .qp-tile { padding: 8px 4px; text-align: center; border-radius: 10px; }
  .qp-tile .n { font-size: 22px; font-weight: bold; line-height: 1.3; }
  .qp-tile .l { font-size: 12px; color: var(--sub); }
  .qp-nav { display: flex; gap: 6px; align-items: center; margin-left: auto; }
  .qp-nav button { padding: 4px 10px; }
  .qp-no { font-weight: bold; font-size: 18px; }
  .qp-text { font-size: 16.5px; margin: 8px 0 10px; }
  .qp-ch { padding: 3px 12px; border: 2px solid transparent; border-radius: 999px; display: inline-block; }
  .qp-ch.ok { border-color: var(--ng); color: var(--ng); font-weight: bold; }
  /* 答え：赤いわくの帯にして、どこに答えがあるかすぐわかるようにする */
  .qp-ans, .qp-model { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; background: var(--ngbg); border: 2px solid var(--ng); border-radius: 10px; padding: 8px 12px; margin: 10px 0 6px; }
  .qp-ans .lb, .qp-model .lb { flex: 0 0 auto; background: var(--ng); color: #fff; font-weight: bold; font-size: 14px; border-radius: 6px; padding: 0 10px; }
  .qp-ans .ok { color: var(--ng); font-weight: bold; font-size: 19px; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
  .qp-model .ok { color: var(--ng); flex: 1 1 220px; }
  .qp-model .small { flex: 0 0 100%; }
  .qp-point { background: var(--warnbg); color: #92400e; border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
  .qp-exp { background: var(--soft); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
  .qp-point h4, .qp-exp h4 { font-size: 14.5px; margin: 0 0 4px; }
  .qp-point ul, .qp-exp ol { margin: 0; padding-left: 1.3em; }
  .qp-point li, .qp-exp li { margin: 3px 0; }
  .qp-hint { font-size: 12.5px; color: var(--sub); text-align: center; margin-top: 10px; }
  .exp ol { margin: 2px 0; padding-left: 1.3em; }
  /* 詳しい台本（教科が苦手な講師向け） */
  .gd-btn { width: 100%; margin-top: 12px; padding: 10px; font-weight: bold; color: var(--accent); border: 2px solid var(--accent); background: #fff; }
  .gd { margin-top: 10px; border: 2px solid var(--accent); border-radius: 10px; padding: 10px 12px; }
  .gd h4 { margin: 0 0 6px; font-size: 15px; }
  .gd .know { background: var(--soft); border-radius: 8px; padding: 8px 10px; margin: 6px 0; }
  .gd .know b, .gd .alt b { display: block; font-size: 13px; color: var(--accent); }
  .gd .tk { display: flex; gap: 8px; padding: 4px 0; border-bottom: 1px dotted #e5e7eb; }
  .gd .who { flex: 0 0 36px; font-size: 11px; font-weight: bold; color: #fff; background: var(--accent); border-radius: 4px; text-align: center; height: 20px; line-height: 20px; margin-top: 3px; }
  .gd .tk.S .who { background: #059669; }
  .gd .tk.S span:last-child { color: #047857; }
  .gd .trouble { background: var(--ngbg); border-radius: 8px; padding: 8px 10px; margin: 6px 0; }
  .gd .trouble b { display: block; font-size: 13px; color: var(--ng); }
  .gd .trouble .tq { font-weight: bold; }
  .gd .alt { background: var(--okbg); border-radius: 8px; padding: 8px 10px; margin: 6px 0; }
  @media print { .qp-point, .qp-exp, .qp-model, .qp-ans { -webkit-print-color-adjust: exact; print-color-adjust: exact; } .qp-text { font-size: 14px; } }
  /* ○×で採点 */
  [hidden] { display: none !important; }
  .qpick { flex-wrap: wrap; }
  .exam .exam-btns { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin-top: 8px; }
  .exam .exam-btns button { display: flex; flex-direction: column; align-items: flex-start; text-align: left; padding: 8px 10px; }
  .iv-box { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin: 10px 0; line-height: 1.8; }
  .iv-q { border-top: 1px solid var(--line); padding: 8px 0; break-inside: avoid; }
  .iv-line { border-bottom: 1px dashed #9ca3af; height: 26px; }
  .qp-inline { flex: 0 0 100%; margin: 6px 0 2px 28px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; cursor: auto; }
  .qp-inline .gd-btn { margin-top: 8px; }
  .ig { flex: 0 0 100%; display: flex; flex-direction: column; gap: 6px; margin: 2px 0 0 28px; }
  .ig-key { color: var(--ng); font-weight: bold; font-size: 14px; }
  .ig:empty { display: none; }
  .ig-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .ig-row .nm { min-width: 4.5em; font-size: 13px; font-weight: bold; }
  .ig-row > button, .ig-parts button { width: 48px; height: 40px; font-size: 19px; font-weight: bold; padding: 0; color: var(--sub); }
  .ig-parts { display: flex; gap: 6px; }
  .ig-parts button { width: auto; padding: 0 10px; font-size: 14px; }
  .ig-row button.on.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .ig-row button.on.ng { background: var(--ng); border-color: var(--ng); color: #fff; }
  .ig-row button.on.part { background: var(--warn); border-color: var(--warn); color: #fff; font-size: 14px; }
  .ig-tot { font-size: 14px; font-weight: bold; margin: 4px 0; }
  .ig-st { padding: 4px 0; }
  .ig-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; align-items: center; gap: 10px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: #fff; box-shadow: 0 -2px 8px rgba(0,0,0,.08); }
  .ig-bar.off { display: none; }
  .ig-bar.wait { background: var(--warnbg); }
  .ig-bar.todo { background: #fff; }
  .ig-bar button.ig-mid { padding: 8px 12px; font-size: 13px; font-weight: normal; color: var(--sub); }
  .ig-bar.ok { background: var(--okbg); color: var(--ok); font-weight: bold; }
  .ig-bar-t { flex: 1; min-width: 0; font-size: 14px; }
  .ig-bar button { padding: 12px 18px; font-size: 16px; font-weight: bold; white-space: nowrap; }
  .ig-toast { bottom: 90px !important; }
  .ig-st.fin { background: var(--okbg); border-radius: 8px; padding: 8px 10px; margin: 4px 0; }
  .ig-done { color: var(--ok); }
  .ig-miss { font-weight: normal; margin-top: 2px; }
  .ig-miss b { color: var(--ng); font-size: 17px; }
  .ig-toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: #1f2937; color: #fff; border-radius: 20px; padding: 8px 16px; font-size: 14px; z-index: 50; width: max-content; max-width: calc(100% - 32px); text-align: center; }
  .ig-toast.bad { background: var(--ng); }
  .toolbar { position: sticky; top: 0; z-index: 6; background: #fff; border-bottom: 1px solid var(--line); }
  .toolbar .wrap { padding: 8px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  @media print {
    body { background: #fff; font-size: 13px; }

    .wrap { padding: 0; max-width: none; }
    .paper { box-shadow: none; margin: 0; padding: 0; max-width: none; }
    @page { size: A4; margin: 13mm 14mm; }
    .newpage { break-before: page; }
  }
</style>

<body>
<div id="app"><div class="login"><div class="loading">読みこみ中…</div></div></div>

<script>
const S = { code: '', data: null, tab: 'make', grade: '小6', unit: null, qs: [], print: null, mode: 'student', score: null, anGrade: '小6' };
const $app = document.getElementById('app');
const KANA = { A: 'ア', B: 'イ', C: 'ウ', D: 'エ' };
const CIRC = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';

// ---- 道具 ----
// Apps Script の画面として開いたときは google.script.run、別の場所に置いたときは API_URL を呼ぶ
const API_URL = 'https://script.google.com/macros/s/AKfycbwQ8MzIHvOK5BCYpRZlVg9EXnk12Bh79-98XdW0XS0sTI4-AK6Da_GY9RJYwkZzJGQ/exec';
function run(fn, ...args) {
  if (window.google && google.script && google.script.run) {
    return new Promise((ok, ng) => google.script.run.withSuccessHandler(ok).withFailureHandler(e => ng(e))[fn](...args));
  }
  // クッキーを送らないので、Googleアカウントの切りかえ（/u/1/ など）がおきない
  return fetch(API_URL, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }) })
    .then(r => { if (!r.ok) throw new Error('通信できませんでした（' + r.status + '）'); return r.json(); })
    .then(d => { if (!d.ok) throw new Error(d.error); return d.result; });
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
/** 文字を安全にして、「1/2」を縦の分数にする */
/**
 * 文字を安全にして、分数を縦の形にする
 * ・「3/4」→ 縦の分数。分子・分母は 数（小数も）・□・アルファベット1文字（x/3 など）
 * ・「2と3/4」（帯分数）→「と」を消して、整数のすぐ右に分数をならべる
 */
const FR = '(\\d+(?:\\.\\d+)?|□|[a-zA-Z])';
// 前後が英字・数字のときは分数にしない（km/h などをまちがえて分数にしないため）
const FRAC_RE = new RegExp('(?<![a-zA-Z\\d.])(?:(\\d+)と)?' + FR + '\\/' + FR + '(?![\\d.a-zA-Z])', 'g');
function fracHtml(n, d) { return '<span class="frac"><span class="fn">' + n + '</span><span class="fl"></span><span class="fd">' + d + '</span></span>'; }
function fmt(s) {
  return esc(s).replace(FRAC_RE, (m, whole, n, d) => whole ? '<span class="mixed"><span class="whole">' + whole + '</span>' + fracHtml(n, d) + '</span>' : fracHtml(n, d))
    .replace(/\n/g, '<br>');
}
function fig(f) {
  f = String(f || '').trim();
  if (!f) return '';
  // 横に広い図（viewBox の幅が330より大きい）は、問題文の下に大きく出す
  const vb = f.match(/viewBox="[-\d.]+\s+[-\d.]+\s+([\d.]+)/);
  const wide = vb && Number(vb[1]) > 330;
  if (/^<svg[\s>]/i.test(f)) return '<div class="fig' + (wide ? ' wide' : '') + '">' + f.replace(/<script[\s\S]*?<\/script>/gi, '').replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '').replace(/javascript:/gi, '') + '</div>';
  if (/^https:\/\//.test(f)) return '<div class="fig"><img src="' + esc(f) + '" style="max-width:220px"></div>';
  return '';
}
function circ(n) { return CIRC[n - 1] || '(' + n + ')'; }
function pct(r) { return r == null ? '−' : Math.round(r * 100) + '%'; }
function rc(r) { return r == null ? '' : r < 0.4 ? 'r0' : r < 0.6 ? 'r1' : r < 0.8 ? 'r2' : 'r3'; }
function errMsg(e) { return esc((e && e.message) || e || 'エラーが起きました'); }
function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function loading(t) { $app.innerHTML = '<div class="loading">' + esc(t || '読みこみ中…') + '</div>'; }

// ---- 画面の行き来：画面を開くたびに履歴に積み、「‹ 戻る」やスマホ・タブレットのバックキーで1つ前の画面に戻る ----
const NAV = [null];   // NAV[k]：k番目の画面をもう一度出す関数
let navK = 0;
function navTo(fn) { navK++; NAV.length = navK; NAV[navK] = fn; history.pushState({ k: navK }, ''); fn(); }
function navSwap(fn) { NAV[navK] = fn; history.replaceState({ k: navK }, ''); fn(); }
/** いちばん下の画面にする（ログインした直後など） */
function navBase(fn) { navK = 0; NAV.length = 1; NAV[0] = fn; history.replaceState({ k: 0 }, ''); fn(); }
function goBack() { if (navK > 0) history.back(); }
window.addEventListener('popstate', e => {
  const k = e.state && e.state.k;
  if (k != null && NAV[k]) { navK = k; NAV[k](); }
});
const mainScreen = (tab, unit) => () => { S.tab = tab || 'make'; S.unit = unit || null; showMain(); };

  $app.innerHTML = `<div class="login card">

  const go = () => login(document.getElementById('code').value);

  document.getElementById('adm').onclick = () => navTo(() => showAdmin());

async function login(code) {
  loading();
  try {
    S.data = await run('startApp', code);
    S.code = code; store('sk_code', code);
    S.grade = load('sk_grade') || '小6';
    S.anGrade = S.grade;
    navBase(mainScreen('make'));
  } catch (e) { store('sk_code', null); navBase(() => showLogin(errMsg(e))); }
}
async function refresh() { S.data = await run('startApp', S.code); }

// ---- 管理者：講師コード・管理者コード・教室名を変える（一度入れた管理者コードは、その端末に覚えておく） ----
async function showAdmin(err) {
  const back = goBack;
  const saved = err ? '' : load('sk_admin');
  if (saved) {
    loading();
    try { return adminForm(saved, await run('adminGet', saved)); }
    catch (e) { store('sk_admin', null); err = errMsg(e); }   // 管理者コードが変わっていたら、入れ直してもらう
  }
  $app.innerHTML = `<div class="login card" style="text-align:left">
    <h2 style="margin:4px 0 2px;text-align:center">⚙ 管理者</h2><div class="small" style="text-align:center">講師コードなどを変えるときに使います</div>
    ${err ? '<div class="err">' + err + '</div>' : ''}
    <div style="margin:16px 0 8px"><input id="acode" type="text" placeholder="管理者コード" style="width:100%" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
    <button class="pri" id="ago" style="width:100%">入る</button>
    <div style="margin-top:10px;text-align:center"><button id="aback">‹ 戻る</button></div></div>`;
  const go = async () => {
    const ac = document.getElementById('acode').value.trim();
    loading();
    try { const cur = await run('adminGet', ac); store('sk_admin', ac); adminForm(ac, cur); } catch (e) { showAdmin(errMsg(e)); }
  };
  document.getElementById('ago').onclick = go;
  document.getElementById('acode').onkeydown = e => { if (e.key === 'Enter') go(); };
  document.getElementById('aback').onclick = back;
}
function adminForm(ac, cur, msg, err) {
  const back = goBack;
  const field = (id, label, now, note) => `<div style="margin:12px 0 4px"><b>${label}</b>${now != null ? `<span class="small">　今：${esc(now)}</span>` : ''}</div>
    <input id="${id}" type="text" style="width:100%" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="変えるときだけ入力">${note ? `<div class="small">${note}</div>` : ''}`;
  $app.innerHTML = `<div class="login card" style="text-align:left;max-width:420px">
    <h2 style="margin:4px 0 2px;text-align:center">⚙ 管理者</h2>
    ${msg ? '<div class="msg">' + msg + '</div>' : ''}${err ? '<div class="err">' + err + '</div>' : ''}
    ${field('nt', '講師コード', cur.teacherCode, '変えると、ほかの講師は次に開いたときに新しいコードの入力が必要になります。')}
    ${field('na', '管理者コード', null, 'この画面に入るためのコードです。講師コードとはちがうものにしてください。')}
    ${field('ns', '教室名', cur.school, 'プリントの上に出る名前です。')}
    <button class="pri" id="save" style="width:100%;margin-top:16px">変更を保存する</button>
    <div class="row" style="margin-top:10px;justify-content:space-between"><button id="aback">‹ 戻る</button>
      <button id="aforget" class="small" style="border:none;background:none;color:var(--sub);text-decoration:underline">この端末で管理者コードを忘れる</button></div></div>`;
  document.getElementById('aback').onclick = back;
  document.getElementById('aforget').onclick = () => { store('sk_admin', null); back(); };
  document.getElementById('save').onclick = async () => {
    const v = { teacherCode: document.getElementById('nt').value.trim(), adminCode: document.getElementById('na').value.trim(), school: document.getElementById('ns').value.trim() };
    if (!v.teacherCode && !v.adminCode && !v.school) return adminForm(ac, cur, '', '変える項目に入力してください。');
    const what = [v.teacherCode && '講師コード', v.adminCode && '管理者コード', v.school && '教室名'].filter(Boolean).join('・');
    if (!confirm(what + 'を変更します。よろしいですか？')) return;
    loading('保存しています…');
    try {
      const now = await run('adminSave', ac, v);
      // 自分の端末に保存してある講師コードも新しいものにする
      if (v.teacherCode && S.code) { S.code = v.teacherCode; store('sk_code', v.teacherCode); }
      if (v.adminCode) store('sk_admin', v.adminCode);
      if (v.school && S.data) S.data.school = now.school;
      adminForm(v.adminCode || ac, now, what + 'を変更しました。');
    } catch (e) { adminForm(ac, cur, '', errMsg(e)); }
  };
}

function gradeChips(cur, id) {

// ---- プリントを作る：学年 → 月 → 週（単元） ----
const SUBJECTS = ['算数', '国語', '理科', '社会'];
/** 「1」「2〜3」「1,2」→ [1] / [2,3] / [1,2] */
function weeksOf(w) {
  const s = String(w || '').replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  const m = s.match(/(\d)\s*[〜~～\-－ー]\s*(\d)/);
  if (m) { const a = []; for (let i = +m[1]; i <= +m[2]; i++) a.push(i); return a; }
  return (s.match(/\d/g) || []).map(Number);
}
function thisWeek() { return Math.min(4, Math.ceil(new Date().getDate() / 7)); }
function showMake() {
  S.subj = S.subj || load('sk_subj') || '算数';
  const list = (S.data.curriculum[S.grade] || []).filter(u => S.subj === '全部' || u.subject === S.subj);
  // 月ごと → 教科ごと → 週ごとにまとめる（教材の範囲・復習は教科ごとに1回だけ出す）
  const months = [];
  list.forEach(u => {
    let m = months.find(x => x.m === u.month); if (!m) months.push(m = { m: u.month, subs: [] });
    let s = m.subs.find(x => x.subject === u.subject); if (!s) m.subs.push(s = { subject: u.subject, range: u.range, review: u.review, units: [] });
    if (!s.range && u.range) s.range = u.range;
    if (!s.review && u.review) s.review = u.review;
    s.units.push(u);
  });
  const now = S.data.month, wk = thisWeek();
  const unitCard = u => `<div class="unit ${u.total ? '' : 'empty'}" data-u="${esc(u.unit)}"><div><div class="nm">${esc(u.unit)}</div>
    ${u.detail ? `<div class="pt">${esc(u.detail)}</div>` : ''}
    ${u.point ? `<div class="pt" style="color:var(--accent)">桜中ポイント：${esc(u.point)}</div>` : ''}
    ${u.hasPlan ? '<div class="pt"><span class="tp" style="background:#ecfdf5;color:#047857">台本あり</span></div>' : ''}
    ${u.from && u.from.length ? `<div class="pt">まとめる単元：${esc(u.from.join('、'))}</div>` : ''}</div>
    <div class="cnt">${u.from && u.from.length ? (u.total ? `自動で${S.grade === '小4' ? 10 : 12}問えらんで作る ›` : '問題なし') : u.total ? '問題 ' + u.total + '問 ›' : '問題なし'}</div></div>`;
  const weekLabel = (ws, isNow) => `<div class="wk ${isNow ? 'now' : ''}">${ws.length ? '第' + (ws.length > 1 ? ws[0] + '〜' + ws[ws.length - 1] : ws[0]) + '週' : '週の指定なし'}${isNow ? '（今週）' : ''}</div>`;
  const subjBlock = (m, s) => {
    const groups = [];
    s.units.forEach(u => { const k = String(u.week || ''); let g = groups.find(x => x.k === k); if (!g) groups.push(g = { k: k, ws: weeksOf(k), units: [] }); g.units.push(u); });
    groups.sort((a, b) => (a.ws[0] || 9) - (b.ws[0] || 9));
    const hasTest = !s.units.some(u => weeksOf(u.week).includes(4));
    const canTest = s.units.some(u => u.total);
    return `${S.subj === '全部' ? `<div class="small" style="margin:2px 0 0 4px"><span class="tp">${esc(s.subject)}</span></div>` : ''}
      ${groups.map(g => weekLabel(g.ws, m.m === now && g.ws.includes(wk)) + g.units.map(unitCard).join('')).join('')}
      ${hasTest ? weekLabel([4], m.m === now && wk === 4) + `<div class="unit test ${canTest ? '' : 'empty'}" ${canTest ? `data-test="${m.m}"` : ''} data-subj="${esc(s.subject)}"><div><div class="nm">${m.m}月の確認テスト</div>
        <div class="pt">この月の単元の問題から、自動で${S.grade === '小4' ? 10 : 12}問えらんで作ります（挑戦レベルはのぞく）</div></div><div class="cnt">${canTest ? '作る ›' : '問題なし'}</div></div>` : ''}
      ${s.review ? `<div class="small" style="margin:0 0 4px 4px">復習：${esc(s.review)}</div>` : ''}`;
  };
  const subjChips = `<div class="chips" id="sc">${SUBJECTS.concat('全部').map(s => `<button data-s="${s}" class="${s === S.subj ? 'on' : ''}">${s}</button>`).join('')}</div>`;
  // 月はボタンでえらび、えらんだ月の指導内容だけを出す（はじめは今月）
  if (!months.some(m => m.m === S.month)) S.month = months.some(m => m.m === now) ? now : (months[0] || {}).m;
  const cur = months.find(m => m.m === S.month);
  const monthBtns = `<div class="mgrid" id="mc">${months.map(m => `<button data-m="${m.m}" class="${m.m === S.month ? 'on' : ''} ${m.m === now ? 'now' : ''}">${m.m}月</button>`).join('')}</div>`;
  // 小6：本番（県立中の適性検査）と同じ形の模試。Ⅰ＝国語・社会、Ⅱ＝算数・理科、どちらも50分
  const exams = S.grade === '小6' ? (S.data.exams || []) : [];
  const examCard = exams.length ? `<div class="card exam"><b>本番形式の模試</b>　<span class="small">県立中の適性検査と同じ形（Ⅰ＝国語・社会、Ⅱ＝算数・理科、各50分）</span>
    <div class="exam-btns">${exams.map(e => `<button data-ex="${esc(e.exam)}" data-rd="${e.round}"><b>適性検査${esc(e.exam)}　${esc(e.label)}</b><span class="small">${esc(e.note)}</span></button>`).join('')}<button data-iv-open><b>面接の練習カード</b><span class="small">よく聞かれる質問と答え方・マナー</span></button></div></div>` : '';
  shell(`${gradeChips(S.grade, 'gc')}${examCard}${subjChips}${monthBtns}
    ${months.length ? '' : '<div class="card">この学年・教科の単元はありません。</div>'}
    ${cur ? `<div class="mhead">${S.grade}・${cur.m}月の指導内容${cur.m === now ? '<span class="small">（今月）</span>' : ''}</div>
    <div class="small">週1回の授業の予定です。単元をえらぶと、授業プリントと宿題プリントを作れます。「問題なし」の単元は、「問題」シートに問題を足すと使えます。◎は特殊算の単元です。</div>
    ${cur.subs.map(s => subjBlock(cur, s)).join('')}` : ''}`);
  document.querySelectorAll('#gc [data-g]').forEach(b => b.onclick = () => { S.grade = b.dataset.g; store('sk_grade', S.grade); showMake(); });
  document.querySelectorAll('#mc [data-m]').forEach(b => b.onclick = () => { S.month = Number(b.dataset.m); showMake(); });
  document.querySelectorAll('#sc [data-s]').forEach(b => b.onclick = () => { S.subj = b.dataset.s; store('sk_subj', S.subj); showMake(); });
  document.querySelectorAll('.unit[data-u]').forEach(d => d.onclick = async () => {
    const u = list.find(x => x.unit === d.dataset.u);
    if (!u || !u.total) return;
    if (!(u.from && u.from.length)) { S.lastPlan = null; navTo(mainScreen('make', u)); return; }
    // 総まとめ：前の単元の問題から自動で作る
    loading('まとめプリントを作っています…');
    try {
      const pr = await run('createReviewPrint', S.code, S.grade, u.unit);
      refresh().catch(() => {});
      navTo(() => { S.print = pr; S.mode = 'student'; showPrint(); });
    } catch (e) { showMake(); alert(e.message || e); }
  });
  document.querySelectorAll('[data-iv-open]').forEach(b => b.onclick = () => navTo(showInterview));
  document.querySelectorAll('[data-ex]').forEach(b => b.onclick = async () => {
    loading('模試を作っています…');
    try {
      const pr = await run('createExamPrint', S.code, b.dataset.ex, Number(b.dataset.rd));
      refresh().catch(() => {});
      navTo(() => { S.print = pr; S.mode = 'student'; showPrint(); });
    } catch (e) { showMake(); alert(e.message || e); }
  });
  document.querySelectorAll('.unit[data-test]').forEach(d => d.onclick = async () => {
    loading('確認テストを作っています…');
    try {
      const pr = await run('createTestPrint', S.code, S.grade, d.dataset.subj, Number(d.dataset.test));
      refresh().catch(() => {});
      navTo(() => { S.print = pr; S.mode = 'student'; showPrint(); });
    } catch (e) { showMake(); alert(e.message || e); }
  });
}

// ---- 単元：授業プリントと宿題プリントを作る ----
async function showUnit() {
  shell('<div class="loading">問題を読みこみ中…</div>');
  // 問題と○×の採点記録を1回の問い合わせでまとめて読む
  try { const d = await run('getUnit', S.code, S.grade, S.unit.unit); S.qs = d.questions; S.unitMarks = d.marks || {}; }
  catch (e) { document.getElementById('main').innerHTML = '<div class="err">' + errMsg(e) + '</div>'; return; }
  const u = S.unit;
  const section = kind => {
    const qs = S.qs.filter(q => q.use === kind);
    return `<div class="card" data-kind="${kind}">
      <div class="row"><b>${kind === '授業' ? '授業で解く問題' : '宿題'}</b><span class="small" data-sel></span>
        <button class="pri" data-make style="margin-left:auto"${qs.length ? '' : ' disabled'}>${kind}プリントを作る</button></div>
      <div class="ig-tot" data-tot></div>
      ${qs.length ? qs.map(q => `<label class="qpick"><input type="checkbox" value="${esc(q.id)}" data-lv="${esc(q.level)}" checked>
        <div style="flex:1;min-width:0"><div><span class="lv ${esc(q.level)}">${esc(q.level)}</span><span class="tp">${{ choice: '4択', number: '答えを書く', write: '説明' }[q.type]}</span>
        <span class="small">${esc(q.id)}・${esc(q.sub)}・${q.points}点</span></div><div class="t">${fmt(q.text)}</div></div>
        <button class="small" data-plan="${esc(q.id)}" style="margin-left:auto;white-space:nowrap">📖 台本</button>
        <div class="ig" data-ig="${esc(q.id)}"></div><div class="qp-inline" data-pi="${esc(q.id)}" hidden></div></label>`).join('')
      : `<div class="small">${kind}用の問題はまだありません。「問題」シートの「用途」に「${kind}」と入れると、ここに出ます。</div>`}</div>`;
  };
  document.getElementById('main').innerHTML = `
    <div class="row noprint"><button id="back">‹ 戻る</button>
      <span class="chips" id="lvf" style="margin:0 0 0 auto">${['全部', '基本', '標準', '挑戦'].map(l => `<button data-l="${l}">${l === '全部' ? '全部' : l + 'だけ'}</button>`).join('')}</span></div>
    <div class="card"><div class="small">${esc(S.grade)}・${u.month}月${u.week ? '・第' + esc(u.week) + '週' : ''}・${esc(u.subject)}</div><h2 style="margin:2px 0">${esc(u.unit)}</h2>
      ${u.detail ? `<div class="small">${esc(u.detail)}</div>` : ''}
      ${u.point ? `<div class="small">桜中ポイント：${esc(u.point)}</div>` : ''}
      ${u.script ? `<div class="small"><a href="${esc(u.script)}" target="_blank" rel="noopener">講師用台本をひらく</a></div>` : ''}
      <div class="row" style="margin-top:8px"><button class="pri" id="prep">📖 全問の台本を表示</button>
        <span class="small">全部の問題の答え・指導のポイント・解説を、一覧で見られます。プリントは作りません</span></div></div>
    <div class="card" id="gst"></div>
    ${section('授業')}${section('宿題')}`;
  document.getElementById('back').onclick = goBack;
  document.getElementById('prep').onclick = () => showPrep();
  // 問題の横の「台本」：その問題の画面をすぐ開く（チェックボックスは切りかえない）
  // 問題の横の「台本」：〇×の下に、答え・指導のポイント・解説をその場で開く（単元を開いたときに読みこみ済みなので、問い合わせはしない）
  document.querySelectorAll('[data-plan]').forEach(b => b.onclick = e => {
    e.preventDefault(); e.stopPropagation();   // 問題のチェックは切りかえない
    const id = b.dataset.plan, box = document.querySelector('[data-pi="' + id + '"]'), q = S.qs.find(x => x.id === id);
    if (!box || !q) return;
    if (box.hidden) {
      box.innerHTML = prepBodyHtml(q) + (q.guide && q.guide.length ? `<button class="gd-btn" data-gdb>📘 さらにわかりやすく、詳しい台本</button><div class="gd" hidden><h4>詳しい台本（この教科が苦手な先生向け）</h4>${guideHtml(q.guide)}</div>` : '');
      const g = box.querySelector('[data-gdb]');
      if (g) g.onclick = ev => { ev.preventDefault(); ev.stopPropagation(); const d = box.querySelector('.gd'); d.hidden = !d.hidden; };

    } else { box.hidden = true; b.textContent = '📖 台本'; }
  });
  // 開いた台本の中を押しても、問題のチェックが切りかわらないようにする
  document.querySelectorAll('.qp-inline').forEach(box => box.addEventListener('click', e => { if (!e.target.closest('button')) e.preventDefault(); }));
  // 台本から戻ってきたときは、さっき見ていた問題の位置を出す
  const lp = S.lastPlan && document.querySelector('[data-plan="' + S.lastPlan + '"]');
  if (lp) window.scrollTo(0, lp.closest('.qpick').getBoundingClientRect().top + window.scrollY - 70);
  const cards = [...document.querySelectorAll('[data-kind]')];
  const count = card => {
    const on = [...card.querySelectorAll('.qpick input')].filter(b => b.checked);
    const pts = S.qs.filter(q => on.some(b => b.value === q.id)).reduce((s, q) => s + q.points, 0);
    card.querySelector('[data-sel]').textContent = on.length ? '　' + on.length + '問・' + pts + '点満点' : '';
  };
  cards.forEach(card => { card.querySelectorAll('.qpick input').forEach(b => b.onchange = () => count(card)); count(card); });
  document.querySelectorAll('#lvf [data-l]').forEach(b => b.onclick = () => {
    cards.forEach(card => { card.querySelectorAll('.qpick input').forEach(x => { x.checked = b.dataset.l === '全部' || x.dataset.lv === b.dataset.l; }); count(card); });
  });
  // 同じ単元・同じ問題のプリントが前にあればそのID。なければ新しく作る（同じプリントがふえないように）
  const printFor = async (card, btn, busy) => {
    const kind = card.dataset.kind;
    const ids = [...card.querySelectorAll('.qpick input')].filter(b => b.checked).map(b => b.value);
    if (!ids.length) { alert('問題を1つ以上えらんでください。'); return null; }
    const key = ids.slice().sort().join(',');
    S.data.prints = S.data.prints || [];
    const same = S.data.prints.find(p => p.grade === S.grade && p.unit === u.unit && p.kind === kind && (p.ids || []).slice().sort().join(',') === key);
    if (same) return same.id;
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = busy;
    try {
      const id = (await run('createPrint', S.code, S.grade, u.unit, ids, '', kind)).print.id;
      S.data.prints.unshift({ id: id, grade: S.grade, unit: u.unit, kind: kind, ids: ids });
      refresh().catch(() => {});
      return id;
    } catch (err) { alert(err.message || err); return null; }
    finally { btn.disabled = false; btn.textContent = label; }
  };
  cards.forEach(card => card.querySelector('[data-make]').onclick = async e => {
    const id = await printFor(card, e.target, '作っています…');
    if (!id) return;
    loading('プリントを読みこみ中…');
    try { const pr = await run('getPrint', S.code, id); navTo(() => { S.print = pr; S.mode = 'student'; showPrint(); }); }
    catch (err) { alert(err.message || err); showUnit(); }
  });
  inlineGrade(u, cards);
}

// ---- その場で○×：生徒をえらぶと、問題ごとに○△×が出る。押すとすぐ保存（合計と苦手な単元は自動） ----
// 点数は「その単元の授業（宿題）の問題 全部」のプリントにまとめて記録する。押していない問題は記録しない
function inlineGrade(u, cards) {
  const box = document.getElementById('gst');
  const stAll = () => (S.data.students || []).filter(s => s.grade === S.grade);
  const SK = 'sk_gst_' + S.grade;
  let pick = load(SK) ? String(load(SK)).split(',') : [];
  pick = pick.filter(id => stAll().some(s => s.id === id));
  const qOf = id => S.qs.find(q => q.id === id);
  const G = {};
  ['授業', '宿題'].forEach(kind => {
    const ids = S.qs.filter(q => q.use === kind).map(q => q.id);
    const key = ids.slice().sort().join(',');
    const same = (S.data.prints || []).find(p => p.grade === S.grade && p.unit === u.unit && p.kind === kind && (p.ids || []).slice().sort().join(',') === key);
    G[kind] = { id: same ? same.id : null, ids: ids, marks: {} };
  });
  // 前に押した○×（単元を開いたときにいっしょに読んだもの）
  Object.keys(G).forEach(k => {
    const m = (S.unitMarks || {})[k];
    if (!m) return;
    G[k].id = m.id;
    Object.keys(m.scores || {}).forEach(sid => { G[k].marks[sid] = {}; Object.keys(m.scores[sid]).forEach(q => { G[k].marks[sid][q] = Number(m.scores[sid][q]); }); });
  });
  let toastT;
  const toast = (m, bad, ms) => {
    let t = document.querySelector('.ig-toast');
    if (!t) { t = document.createElement('div'); t.className = 'ig-toast'; document.body.appendChild(t); }
    t.textContent = m; t.classList.toggle('bad', !!bad); t.hidden = false;
    clearTimeout(toastT); if (!bad) toastT = setTimeout(() => { t.hidden = true; }, ms || 1500);
  };
  const drawBox = () => {
    box.innerHTML = `<b>採点する生徒</b> <span class="small">えらぶと、問題ごとに○×が出ます（もう一度押すと取り消し）。つけ終わったら、下の「完了して保存」を押してください。</span>
      <div class="chips">${stAll().map(s => `<button data-sp="${esc(s.id)}" class="${pick.includes(s.id) ? 'on' : ''}">${esc(s.name)}</button>`).join('')}
        <button data-addst>＋ 生徒を足す</button></div>
      <div class="row" data-addf hidden><input id="nn" placeholder="名前（${esc(S.grade)}）" style="flex:1;min-width:0"><button id="add">足す</button></div>`;
    box.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => {
      const id = b.dataset.sp;
      pick = pick.includes(id) ? pick.filter(x => x !== id) : pick.concat(id);
      store(SK, pick.join(','));
      drawBox(); drawAll();
    });
    box.querySelector('[data-addst]').onclick = () => { const f = box.querySelector('[data-addf]'); f.hidden = !f.hidden; if (!f.hidden) document.getElementById('nn').focus(); };
    document.getElementById('add').onclick = async e => {
      const name = document.getElementById('nn').value.trim();
      if (!name) return alert('名前を入れてください。');
      e.target.disabled = true;
      try {
        const st = await run('addStudent', S.code, name, S.grade);
        S.data.students = S.data.students || [];
        if (!S.data.students.some(s => s.id === st.id)) S.data.students.push({ id: st.id, name: st.name, grade: S.grade });
        if (!pick.includes(st.id)) pick.push(st.id);
        store(SK, pick.join(','));
        drawBox(); drawAll();
      } catch (err) { alert(err.message || err); e.target.disabled = false; }
    };
  };
  const drawQ = qid => {
    const el = document.querySelector('[data-ig="' + qid + '"]'); if (!el) return;
    const q = qOf(qid), g = G[q.use];
    const st0 = pick.some(sid => stAll().some(s => s.id === sid));
    const no = noOf(qid);
    el.innerHTML = (st0 ? `<div class="ig-key">${no ? '<span class="qp-no">' + circ(no) + '</span> ' : ''}${q.type === 'write' ? '説明の問題（採点のめやすは台本に）' : '答え ' + fmt(keyText(q))}</div>` : '') + pick.map(sid => {
      const st = stAll().find(s => s.id === sid); if (!st) return '';
      const v = (g.marks[sid] || {})[qid], has = v != null && !isNaN(v), part = has && v > 0 && v < q.points;
      return `<div class="ig-row" data-st="${esc(sid)}"><span class="nm">${esc(st.name)}</span>
        <button data-v="${q.points}" class="${has && v === q.points ? 'on ok' : ''}">○</button>
        ${q.points > 1 ? `<button data-v="part" class="${part ? 'on part' : ''}">${part ? v + '点' : '△'}</button>` : ''}
        <button data-v="0" class="${has && v === 0 ? 'on ng' : ''}">×</button>
        <span class="ig-parts" hidden>${Array.from({ length: q.points - 1 }, (_, k) => `<button data-v="${k + 1}">${k + 1}点</button>`).join('')}</span></div>`;
    }).join('');
  };
  // 印刷したプリント（チェックした問題）の番号。チェックしていない問題は番号なし
  const checkedIds = kind => { const c = cards.find(x => x.dataset.kind === kind); return c ? [...c.querySelectorAll('.qpick input')].filter(b => b.checked).map(b => b.value) : []; };
  const noOf = qid => checkedIds(qOf(qid).use).indexOf(qid) + 1;
  // 合計。チェックした問題を全部押し終わった生徒は「採点おわり」と、×・△だった問題の番号を出す
  const drawTot = kind => {
    const card = cards.find(c => c.dataset.kind === kind); if (!card) return;
    const g = G[kind], on = checkedIds(kind);
    card.querySelector('[data-tot]').innerHTML = pick.map(sid => {
      const st = stAll().find(s => s.id === sid), m = g.marks[sid] || {};
      const has = id => m[id] != null && !isNaN(m[id]);
      const done = g.ids.filter(has);
      if (!st || !done.length) return '';
      const got = done.reduce((s, id) => s + m[id], 0), max = done.reduce((s, id) => s + qOf(id).points, 0);
      const left = on.filter(id => !has(id)).length;
      if (left) return `<div class="ig-st">${esc(st.name)}　${got}／${max}点　<span class="small">あと${left}問</span></div>`;
      const miss = on.filter(id => m[id] < qOf(id).points);
      return `<div class="ig-st fin">${esc(st.name)}　${got}／${max}点　<span class="ig-done">✅ 採点おわり</span>
        <div class="ig-miss">${miss.length ? '×・△だった問題：' + miss.map(id => `<b>${circ(noOf(id))}</b>`).join(' ') + '　→ もう一度やってみよう' : '🎉 全問正解！'}</div></div>`;
    }).join('');
  };
  const drawAll = () => { S.qs.forEach(q => drawQ(q.id)); drawTot('授業'); drawTot('宿題'); };
  // 問題のチェックを変えたら、番号と「あと何問」を出し直す
  cards.forEach(card => card.addEventListener('change', () => { S.qs.filter(q => q.use === card.dataset.kind).forEach(q => drawQ(q.id)); drawTot(card.dataset.kind); drawBar(); }));
  document.querySelectorAll('#lvf [data-l]').forEach(b => b.addEventListener('click', () => setTimeout(() => { drawAll(); drawBar(); }, 0)));
  // 保存：○×を押しても、まだ保存しない。つけ終わったら「完了して保存」でまとめて保存する
  // 保存前の○×は、この端末に下書きとして残す（戻ったり閉じたりしても消えない）
  const DK = 'sk_igd_' + S.grade + '|' + u.unit;
  Object.keys(G).forEach(k => { G[k].dirty = new Set(); });
  const keepDraft = () => {
    const d = {};
    Object.keys(G).forEach(k => G[k].dirty.forEach(sid => { (d[k] = d[k] || {})[sid] = G[k].marks[sid] || {}; }));
    store(DK, Object.keys(d).length ? JSON.stringify(d) : null);
  };
  try {
    const d = JSON.parse(load(DK) || '{}');
    Object.keys(d).forEach(k => { if (G[k]) Object.keys(d[k]).forEach(sid => { G[k].marks[sid] = d[k][sid]; G[k].dirty.add(sid); }); });
  } catch (e) { store(DK, null); }
  const dirtyNames = () => {
    const ids = new Set(); Object.keys(G).forEach(k => G[k].dirty.forEach(sid => ids.add(sid)));
    return [...ids].map(sid => (stAll().find(s => s.id === sid) || {}).name).filter(Boolean);
  };
  let savedMsg = '';
  const bar = document.createElement('div');
  bar.className = 'ig-bar';
  box.parentNode.appendChild(bar);
  const spacer = document.createElement('div');
  spacer.style.height = '90px';
  box.parentNode.appendChild(spacer);
  const drawBar = () => {
    const names = dirtyNames();
    // まだ押していない問題（チェックした問題のうち）。全部押し終わったら「完了して保存」を出す
    const left = [];
    Object.keys(G).forEach(k => {
      const on = checkedIds(k);
      G[k].dirty.forEach(sid => {
        const m = G[k].marks[sid] || {}, n = on.filter(q => m[q] == null || isNaN(m[q])).length;
        const st = stAll().find(s => s.id === sid);
        if (n && st) left.push(esc(st.name) + (k === '宿題' ? '（宿題）' : '') + ' あと' + n + '問');
      });
    });
    if (names.length && !left.length) {
      bar.className = 'ig-bar wait';
      bar.innerHTML = `<div class="ig-bar-t">全部つけ終わりました。保存してください（${names.map(esc).join('・')}）</div><button class="pri" data-done>完了して保存</button>`;
      bar.querySelector('[data-done]').onclick = () => saveAll();
    } else if (names.length) {
      bar.className = 'ig-bar todo';
      bar.innerHTML = `<div class="ig-bar-t">採点中：${left.join('・')}<div class="small">全部つけると「完了して保存」が出ます</div></div><button data-done class="ig-mid">途中で保存</button>`;
      bar.querySelector('[data-done]').onclick = () => saveAll();
    } else if (savedMsg) {
      bar.className = 'ig-bar ok';
      bar.innerHTML = `<div class="ig-bar-t">${savedMsg}</div>`;
    } else bar.className = 'ig-bar off';
    window.onbeforeunload = names.length ? () => (document.body.contains(bar) ? true : undefined) : null;
  };
  const ensurePrint = async kind => {
    const g = G[kind]; if (g.id) return g.id;
    g.id = (await run('createPrint', S.code, S.grade, u.unit, g.ids, '', kind)).print.id;
    (S.data.prints = S.data.prints || []).unshift({ id: g.id, grade: S.grade, unit: u.unit, kind: kind, ids: g.ids });
    return g.id;
  };
  let saving = false;
  const saveAll = async () => {
    if (saving) return;
    saving = true;
    const btn = bar.querySelector('[data-done]');
    if (btn) { btn.disabled = true; btn.textContent = '保存しています…'; }
    const lines = [];
    try {
      for (const kind of Object.keys(G)) {
        const g = G[kind]; if (!g.dirty.size) continue;
        const id = await ensurePrint(kind);
        const sids = [...g.dirty];
        await run('saveScores', S.code, id, sids.map(sid => {
          const m = g.marks[sid] || {}, sc = {};
          g.ids.forEach(q => { sc[q] = m[q] != null && !isNaN(m[q]) ? m[q] : ''; });
          return { id: sid, scores: sc };
        }));
        sids.forEach(sid => {
          g.dirty.delete(sid);
          const st = stAll().find(s => s.id === sid), m = g.marks[sid] || {};
          const done = g.ids.filter(q => m[q] != null && !isNaN(m[q]));
          if (st) lines.push(esc(st.name) + (done.length ? ' ' + done.reduce((s, q) => s + m[q], 0) + '／' + done.reduce((s, q) => s + qOf(q).points, 0) + '点' : ' 記録なし') + (kind === '宿題' ? '（宿題）' : ''));
        });
      }
      keepDraft();
      const t = new Date();
      savedMsg = `✅ 保存しました（${t.getHours()}:${String(t.getMinutes()).padStart(2, '0')}）　${lines.join('、')}`;
      toast('✅ 保存しました', false, 2500);
      refresh().catch(() => {});
    } catch (e) {
      keepDraft();
      alert('保存できませんでした。電波のよいところで、もう一度「完了して保存」を押してください。\n（' + (e.message || e) + '）');
    }
    saving = false;
    drawBar();
  };
  // 保存していないまま「戻る」を押したとき
  const backBtn = document.getElementById('back');
  if (backBtn) backBtn.onclick = async () => {
    if (dirtyNames().length && confirm('まだ保存していない○×があります。\n保存してから戻りますか？\n\n「キャンセル」なら保存せずに戻ります（下書きはこの端末に残ります）。')) {
      await saveAll();
      if (dirtyNames().length) return;   // 保存できなかったときは残る
    }
    window.onbeforeunload = null;
    goBack();
  };
  cards.forEach(card => card.addEventListener('click', e => {
    const b = e.target.closest('.ig button'); if (!b) return;
    e.preventDefault(); e.stopPropagation();   // 問題のチェックは切りかえない
    const row = b.closest('.ig-row'), qid = b.closest('[data-ig]').dataset.ig, sid = row.dataset.st, q = qOf(qid);
    if (b.dataset.v === 'part') { const p = row.querySelector('.ig-parts'); p.hidden = !p.hidden; return; }
    const g = G[q.use], m = (g.marks[sid] = g.marks[sid] || {}), n = Number(b.dataset.v);
    if (m[qid] === n) delete m[qid]; else m[qid] = n;
    g.dirty.add(sid); savedMsg = '';
    keepDraft();
    drawQ(qid); drawTot(q.use); drawBar();
  }, true));
  drawBox(); drawAll(); drawBar();
}

// ---- 台本：問題の番号をえらぶと、その問題の答え・指導のポイント・解説が出る（プリントは作らない） ----
/** 解説は「｜」で区切ると①②③…の手順になる。「答えの例：」で始まる部分は、説明問題の答えの例として別に出す */
function expParts(exp) {
  const parts = String(exp || '').split('｜').map(s => s.trim()).filter(Boolean);
  let model = '';
  if (parts.length && /^(答えの例|（模範解答）)/.test(parts[0])) model = parts.shift().replace(/^(答えの例[：:]?|（模範解答）)\s*/, '');
  return { model: model, steps: parts };
}
function expHtml(exp) {
  const e = expParts(exp);
  return (e.model ? '<div>' + fmt(e.model) + '</div>' : '') +
    (e.steps.length > 1 ? '<ol>' + e.steps.map(s => '<li>' + fmt(s) + '</li>').join('') + '</ol>' : e.steps.map(fmt).join(''));
}
/** 指導のポイント：「最初に聞く」＋ポイント。まだ書いていない問題は、まちがいやすい点と誤答理由を出す */
function tipsOf(q) {
  if (q.tips.length) return q.tips;
  const t = q.caution ? [q.caution] : [];
  if (q.type === 'choice') q.choices.filter(c => c.letter !== q.answer && q.reasons[c.letter]).forEach(c => t.push(`${KANA[c.letter]}を選んだ子：${q.reasons[c.letter]}`));
  return t;
}
function prepQHtml(q) {
  // 選択式は選択肢の正解に赤い丸をつける
  const chs = q.type === 'choice' ? `<div class="chs">${q.choices.map(c => `<div><span class="qp-ch${c.letter === q.answer ? ' ok' : ''}">${KANA[c.letter]}　${fmt(c.text)}</span></div>`).join('')}</div>` : '';
  return `<div class="qp-text">${fmt(q.text)}</div>${fig(q.figure)}${chs}${prepBodyHtml(q)}`;
}
/** 台本のうち、答え・答えの例・指導のポイント・解説（単元の画面で〇×の下に開くときは、問題文はもう見えているのでこれだけ出す） */
function prepBodyHtml(q) {
  const ok = q.type === 'write' ? '' : `<div class="qp-ans"><span class="lb">答え</span><span class="ok">${fmt(keyText(q))}</span></div>`;
  const e = expParts(q.exp), tips = tipsOf(q);
  const model = q.type === 'write' ? `<div class="qp-model"><span class="lb">答えの例</span><span class="ok">${fmt(e.model || (e.steps.length === 1 ? e.steps[0] : ''))}</span>${q.rubric ? `<div class="small" style="margin-top:4px">採点のめやす：${fmt(q.rubric)}</div>` : ''}</div>` : '';
  const steps = q.type === 'write' && !e.model && e.steps.length === 1 ? [] : e.steps;
  return `${ok}${model}
    ${q.ask || tips.length ? `<div class="qp-point"><h4>指導のポイント</h4><ul>${q.ask ? `<li><b>最初に聞く：</b>${fmt(q.ask)}</li>` : ''}${tips.map(t => '<li>' + fmt(t) + '</li>').join('')}</ul></div>` : ''}
    ${steps.length ? `<div class="qp-exp"><h4>解説</h4>${steps.length > 1 ? '<ol>' + steps.map(s => '<li>' + fmt(s) + '</li>').join('') + '</ol>' : fmt(steps[0])}</div>` : ''}`;
}
/** 詳しい台本：1行ずつ「知：」「T：」「S：」「困：」「別：」で始まる */
function guideHtml(lines) {
  return lines.map(l => {
    const m = l.match(/^(知|T|S|困|別)[：:]\s*(.*)$/);
    if (!m) return '<div>' + fmt(l) + '</div>';
    const t = fmt(m[2]);
    if (m[1] === '知') return '<div class="know"><b>先に知っておくこと</b>' + t + '</div>';
    if (m[1] === '困') {   // 「生徒の質問」→ 答え方
      const [q, ...r] = m[2].split(/\s*→\s*/);
      return '<div class="trouble"><b>されそうな質問</b><div class="tq">' + fmt(q) + '</div>' + (r.length ? '<div>→ ' + fmt(r.join(' → ')) + '</div>' : '') + '</div>';
    }
    if (m[1] === '別') return '<div class="alt"><b>別のやり方</b>' + t + '</div>';
    return '<div class="tk ' + m[1] + '"><span class="who">' + (m[1] === 'T' ? '講師' : '生徒') + '</span><span>' + t + '</span></div>';
  }).join('');
}
let P = null;   // 台本の画面の状態 { d, list:[{q, kind, no}], cur }（cur は1問の画面を出しているときだけ0以上）
/** 台本を読みこむ。openId をわたすとその問題の画面を開き、戻ると単元の問題一覧にもどる。わたさないと全部の問題の一覧を開く */
async function showPrep(openId) {
  loading('台本を読みこみ中…');
  let d;
  try { d = await run('getPrep', S.code, S.grade, S.unit.unit); }
  catch (e) { showUnit(); alert(e.message || e); return; }
  // 番号は印刷するプリントと同じ：授業①〜、宿題①〜
  const list = d.questions.map((q, i) => ({ q: q, kind: '授業', no: i + 1 })).concat(d.homework.map((q, i) => ({ q: q, kind: '宿題', no: i + 1 })));
  const p = { d: d, list: list, cur: -1 };
  const i = openId ? list.findIndex(x => x.q.id === openId) : -1;
  // 読みこみ中の表示は履歴に残さず、単元の画面の次に台本の画面を積む
  if (i < 0) navTo(() => { P = p; prepList(); });
  else navTo(() => { P = p; prepQ(i); });
}

const onQ = () => P && P.cur >= 0 && document.querySelector('.qp-nav');
document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test((e.target && e.target.tagName) || '')) return;
  if (e.key === 'Escape') goBack();
  if (!onQ()) return;
  if (e.key === 'ArrowLeft' && P.cur > 0) prepGo(P.cur - 1);
  if (e.key === 'ArrowRight' && P.cur < P.list.length - 1) prepGo(P.cur + 1);

// スマホ：1問の画面で左右になぞると前後の問題へ
let touchX = null, touchY = null;

  if (!onQ() || touchX == null) return;
  const dx = e.changedTouches[0].clientX - touchX, dy = e.changedTouches[0].clientY - touchY;
  touchX = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) {
    if (dx < 0 && P.cur < P.list.length - 1) prepGo(P.cur + 1);

  }
});

    answers.length ? `<h3>説明問題の答え方</h3><div class="ans">${answers.map(l => `<div>${fmt(l)}</div>`).join('')}</div>` : ''].join('');

      ${trips.length ? `<h3>つまずいたら</h3>${trips.map(trip).join('')}` : ''}
    </div>
    ${more ? `<details class="more newpage"><summary>くわしい台本を見る（${[steps.length && p.flow.length ? '解説の進め方' : '', p.talk.length ? '話す台本' : '', answers.length ? '説明問題の答え方' : ''].filter(Boolean).join('・')}）</summary>${more}</details>` : ''}
  </div>`;
}
// 印刷するときは、たたんだ台本も開いて印刷する
window.addEventListener('beforeprint', () => document.querySelectorAll('details.more').forEach(d => d.open = true));
function paperTeacher(d) {
  return head(d, '講師用・塾内のみ') +
    (d.time ? `<div class="rub" style="background:var(--soft);border-color:#c7d7fb"><b>時間配分（${esc(d.print.kind)}）</b>　${esc(d.time)}</div>` : '') +
    (d.point ? `<div class="rub"><b>桜中ポイント</b>　${esc(d.point)}</div>` : '') +
    (d.script ? `<div class="small noprint" style="margin:6px 0"><a href="${esc(d.script)}" target="_blank" rel="noopener">講師用台本をひらく</a></div><div class="small" style="margin:6px 0">台本：${esc(d.script)}</div>` : '') +
    planHtml(d.plan) +
    `<h3 class="${d.plan ? 'newpage' : ''}" style="font-size:15px;margin:14px 0 4px">答えと採点のめやす</h3>` +
    `<table class="tt"><tr><th>番号</th><th>小単元・レベル</th><th>答え</th><th>採点のめやす／まちがいやすい点</th></tr>
    ${d.questions.map((q, i) => `<tr><td>${circ(i + 1)}<br><span class="small">${q.points}点</span></td><td>${esc(q.sub)}<br><span class="lv ${esc(q.level)}">${esc(q.level)}</span></td>
      <td>${q.type === 'write' ? expHtml(q.exp) : '<b>' + fmt(keyText(q)) + '</b>'}</td>
      <td>${q.rubric ? fmt(q.rubric) : ''}${q.rubric && q.caution ? '<br>' : ''}${q.caution ? '⚠ ' + fmt(q.caution) : ''}${!q.rubric && !q.caution ? '<span class="small">○か×（部分点なし）</span>' : ''}</td></tr>`).join('')}
    </table><div class="small" style="margin-top:8px">合計 ${d.total}点。採点は、アプリの単元の画面で、問題ごとの○×ボタンを押すとできます。</div>`;
}


// ---- 苦手な単元 ----
async function showWeak() {
  shell(`${gradeChips(S.anGrade, 'ac')}<div id="an"><div class="loading">集計しています…</div></div>`);
  document.querySelectorAll('#ac [data-g]').forEach(b => b.onclick = () => { S.anGrade = b.dataset.g; showWeak(); });
  let a;
  try { a = await run('getAnalysis', S.code, S.anGrade); }
  catch (e) { document.getElementById('an').innerHTML = '<div class="err">' + errMsg(e) + '</div>'; return; }
  const used = a.units.filter(u => u.n);
  if (!used.length) { document.getElementById('an').innerHTML = '<div class="card">まだ点数が入っていません。単元の画面で、問題ごとの○×ボタンを押すと、ここに出ます。</div>'; return; }
  const low = used.filter(u => u.avg < a.weakRate).sort((x, y) => x.avg - y.avg);
  document.getElementById('an').innerHTML = `
    ${low.length ? `<div class="card" style="border-color:#fed7aa;background:var(--warnbg)"><b>復習したい単元</b>（クラスの平均が${Math.round(a.weakRate * 100)}%未満）<br>${low.map(u => esc(u.unit) + '（' + pct(u.avg) + '）').join('、')}</div>` : ''}
    <div class="card"><b>生徒ごとの得点率</b>　<span class="small">色：<span class="r0">　40%未満　</span> <span class="r1">　60%未満　</span> <span class="r2">　80%未満　</span> <span class="r3">　80%以上　</span></span>
    <div class="scroll" style="margin-top:6px"><table class="grid"><tr><th class="l">名前</th>${used.map(u => `<th>${esc(u.unit)}${u.month ? '<br>' + u.month + '月' : ''}</th>`).join('')}<th>全体</th><th class="l">苦手な単元</th></tr>
    ${a.students.map(s => `<tr><td class="l" style="white-space:nowrap">${esc(s.name)}</td>${used.map(u => `<td class="${rc(s.rates[u.unit])}">${pct(s.rates[u.unit])}</td>`).join('')}
      <td class="${rc(s.total)}"><b>${pct(s.total)}</b></td><td class="l">${s.weak.length ? s.weak.map(esc).join('、') : '<span class="small">なし</span>'}</td></tr>`).join('')}
    <tr><td class="l"><b>平均</b></td>${used.map(u => `<td class="${rc(u.avg)}"><b>${pct(u.avg)}</b><div class="small">${u.n}人</div></td>`).join('')}<td></td><td></td></tr>
    </table></div></div>
    ${a.hard.length ? `<div class="card"><b>得点率の低い問題</b>（次の授業の最初に復習）
      <table class="grid" style="margin-top:6px"><tr><th>問題</th><th class="l">単元・内容</th><th>得点率</th><th>人数</th></tr>
      ${a.hard.map(h => `<tr><td style="white-space:nowrap">${esc(h.id)}</td><td class="l"><div class="small">${esc(h.unit)}・${esc(h.sub)}</div>${fmt(String(h.text).slice(0, 70))}${h.text.length > 70 ? '…' : ''}</td>
        <td class="${rc(h.rate)}">${pct(h.rate)}</td><td>${h.n}</td></tr>`).join('')}</table></div>` : ''}`;
}
